[package]
name = "whatsapp_usb_bridge"
version = "0.1.0"
edition = "2021"
authors = ["Fausto"]
description = "Controlador y lector de WhatsApp vía USB-C (ADB) en Rust"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"
chrono = "0.4"
colored = "2.1"
anyhow = "1.0"
crossbeam-channel = "0.5"
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.9", features = ["json"] }
eframe = "0.28"
egui = "0.28"
image = { version = "0.25", features = ["png"] }


